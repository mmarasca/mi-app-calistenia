<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ícono de Calira: el mismo aro de cronómetro del diseño de la app,
       coronado como un cronómetro físico, con una silueta en "Vertical"
       (parada de manos, el ejercicio destacado de la app) adentro. Dos
       colores nomás (fondo oscuro + dorado de acento), para que se lea
       bien incluso achicado a 192px. -->
  <rect width="512" height="512" rx="112" fill="#0a0a0a"/>

  <!-- Corona del cronómetro -->
  <rect x="228" y="60" width="56" height="46" rx="14" fill="#ffd166"/>

  <!-- Aro del cronómetro -->
  <circle cx="256" cy="280" r="168" fill="none" stroke="#ffd166" stroke-width="26"/>

  <!-- Figura en Vertical: brazos apoyados + cuerpo derecho + piernas en tijera -->
  <g stroke="#ffd166" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M206 366 L256 320 L306 366"/>
    <path d="M256 320 L256 190"/>
    <path d="M256 190 L226 156"/>
    <path d="M256 190 L286 156"/>
  </g>
  <circle cx="256" cy="352" r="17" fill="#ffd166"/>
</svg>
